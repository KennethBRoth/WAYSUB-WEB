
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waysub · Acceso</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; }
    .logo { text-align: center; color: white; margin-bottom: 32px; }
    .logo h1 { font-size: 32px; }
    .logo p { font-size: 14px; color: #aaa; margin-top: 6px; }
    .card { background: white; border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 360px; }
    .tabs { display: flex; gap: 0; margin-bottom: 24px; border-radius: 10px; overflow: hidden; border: 1px solid #eee; }
    .tab { flex: 1; padding: 10px; text-align: center; font-size: 13px; font-weight: 700; cursor: pointer; background: #f5f5f5; color: #999; transition: all 0.2s; }
    .tab.activo { background: #1a1a2e; color: white; }
    .campo { margin-bottom: 14px; }
    .campo label { font-size: 12px; color: #666; display: block; margin-bottom: 5px; font-weight: 600; }
    .campo input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: border 0.2s; }
    .campo input:focus { border-color: #1a1a2e; }
    .btn-primary { width: 100%; background: #1a1a2e; color: white; border: none; border-radius: 8px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px; }
    .btn-primary:disabled { opacity: 0.6; cursor: wait; }
    .mensaje { text-align: center; padding: 10px; border-radius: 8px; font-size: 13px; margin-top: 12px; display: none; }
    .mensaje.error { background: #fff0f0; color: #c0392b; }
    .mensaje.exito { background: #f0fff4; color: #2a9d5c; }
    .pendiente { text-align: center; padding: 20px; display: none; }
    .pendiente .emoji { font-size: 48px; display: block; margin-bottom: 12px; }
    .pendiente h3 { font-size: 16px; color: #1a1a2e; margin-bottom: 8px; }
    .pendiente p { font-size: 13px; color: #666; line-height: 1.5; }
    .btn-secondary { width: 100%; background: none; border: 1px solid #ddd; border-radius: 8px; padding: 11px; font-size: 13px; color: #666; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

<div class="logo">
  <h1>⚡ Waysub Panel</h1>
  <p>Sistema de gestión de locales</p>
</div>

<div class="card">
  <div class="tabs">
    <div class="tab activo" id="tab-login" onclick="setTab('login')">Iniciar sesión</div>
    <div class="tab" id="tab-registro" onclick="setTab('registro')">Registrarse</div>
  </div>

  <!-- LOGIN -->
  <div id="form-login">
    <div class="campo"><label>Email</label><input type="email" id="login-email" placeholder="tu@email.com"></div>
    <div class="campo"><label>Contraseña</label><input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')entrar()"></div>
    <button class="btn-primary" id="btn-entrar" onclick="entrar()">Entrar</button>
  </div>

  <!-- REGISTRO -->
  <div id="form-registro" style="display:none;">
    <div class="campo"><label>Nombre</label><input type="text" id="reg-nombre" placeholder="Tu nombre"></div>
    <div class="campo"><label>Email</label><input type="email" id="reg-email" placeholder="tu@email.com"></div>
    <div class="campo"><label>Contraseña</label><input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres"></div>
    <button class="btn-primary" id="btn-registrar" onclick="registrar()">Crear cuenta</button>
  </div>

  <!-- PENDIENTE -->
  <div class="pendiente" id="panel-pendiente">
    <span class="emoji">⏳</span>
    <h3>Cuenta pendiente de aprobación</h3>
    <p>Tu cuenta fue creada correctamente. Un administrador debe aprobarla antes de que puedas acceder.</p>
    <button class="btn-secondary" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>

  <div class="mensaje" id="mensaje"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAB2-btgFqGiCe1YdZSDv4EShV601N-uQs",
    authDomain: "waysub-web.firebaseapp.com",
    projectId: "waysub-web",
    storageBucket: "waysub-web.firebasestorage.app",
    messagingSenderId: "219825581217",
    appId: "1:219825581217:web:6f752ee27a5446400114e0"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // Chequear si ya hay sesión activa
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const snap = await getDoc(doc(db, "usuarios", user.uid));
      if (snap.exists()) {
        const datos = snap.data();
        if (datos.aprobado) {
          window.location.href = 'index.html';
        } else {
          mostrarPendiente();
        }
      }
    }
  });

  window.setTab = function(tab) {
    document.getElementById('tab-login').classList.toggle('activo', tab === 'login');
    document.getElementById('tab-registro').classList.toggle('activo', tab === 'registro');
    document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('form-registro').style.display = tab === 'registro' ? 'block' : 'none';
    document.getElementById('panel-pendiente').style.display = 'none';
    ocultarMensaje();
  }

  window.entrar = async function() {
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value;
    if (!email || !pass) { mostrarError('Completá email y contraseña'); return; }
    const btn = document.getElementById('btn-entrar');
    btn.disabled = true; btn.textContent = 'Entrando...';
    try {
      const cred = await signInWithEmailAndPassword(auth, email, pass);
      const snap = await getDoc(doc(db, "usuarios", cred.user.uid));
      if (!snap.exists() || !snap.data().aprobado) {
        await signOut(auth);
        mostrarPendiente();
        btn.disabled = false; btn.textContent = 'Entrar';
        return;
      }
      window.location.href = 'index.html';
    } catch(e) {
      btn.disabled = false; btn.textContent = 'Entrar';
      if (e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') {
        mostrarError('Email o contraseña incorrectos');
      } else {
        mostrarError('Error: ' + e.message);
      }
    }
  }

  window.registrar = async function() {
    const nombre = document.getElementById('reg-nombre').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pass = document.getElementById('reg-pass').value;
    if (!nombre || !email || !pass) { mostrarError('Completá todos los campos'); return; }
    if (pass.length < 6) { mostrarError('La contraseña debe tener al menos 6 caracteres'); return; }
    const btn = document.getElementById('btn-registrar');
    btn.disabled = true; btn.textContent = 'Creando cuenta...';
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      // Guardar usuario en Firestore como pendiente, sin permisos
      await setDoc(doc(db, "usuarios", cred.user.uid), {
        nombre,
        email,
        aprobado: false,
        rol: 'pendiente',
        permisos: {
          'Ramos Mejía': { axionlog: false, coca: false, horas: false, reportes: false },
          'Morón': { axionlog: false, coca: false, horas: false, reportes: false }
        },
        creadoEn: Date.now()
      });
      await signOut(auth);
      btn.disabled = false; btn.textContent = 'Crear cuenta';
      mostrarPendiente();
    } catch(e) {
      btn.disabled = false; btn.textContent = 'Crear cuenta';
      if (e.code === 'auth/email-already-in-use') {
        mostrarError('Este email ya está registrado');
      } else {
        mostrarError('Error: ' + e.message);
      }
    }
  }

  window.cerrarSesion = async function() {
    await signOut(auth);
    location.reload();
  }

  function mostrarPendiente() {
    document.getElementById('form-login').style.display = 'none';
    document.getElementById('form-registro').style.display = 'none';
    document.getElementById('panel-pendiente').style.display = 'block';
    document.getElementById('tab-login').classList.remove('activo');
    document.getElementById('tab-registro').classList.remove('activo');
  }

  function mostrarError(msg) {
    const el = document.getElementById('mensaje');
    el.textContent = msg;
    el.className = 'mensaje error';
    el.style.display = 'block';
  }

  function ocultarMensaje() {
    document.getElementById('mensaje').style.display = 'none';
  }
</script>
</body>
</html>
