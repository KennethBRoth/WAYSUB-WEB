<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Waysub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #f0f2f5; color: #1a1a1a; min-height: 100vh; }
    header { background: #1a1a2e; color: white; padding: 16px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
    .btn-volver { background: rgba(255,255,255,0.15); border: none; color: white; border-radius: 8px; padding: 6px 12px; font-size: 18px; cursor: pointer; }
    header h1 { font-size: 18px; flex: 1; }
    .badge-admin { background: #e63946; border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 700; }
    .seccion-titulo { padding: 16px 16px 6px; font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 1px; }
    .usuario-card { background: white; margin: 8px 16px 0; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
    .usuario-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .usuario-info h4 { font-size: 15px; font-weight: 700; }
    .usuario-info p { font-size: 12px; color: #999; margin-top: 2px; }
    .badge-pendiente { background: #fff8ee; color: #e67e22; border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 700; }
    .badge-aprobado { background: #f0fff4; color: #2a9d5c; border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 700; }
    .badge-rechazado { background: #fff0f0; color: #e63946; border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 700; }
    .btns-aprobacion { display: flex; gap: 8px; margin-bottom: 14px; }
    .btn-aprobar { flex: 1; background: #f0fff4; color: #2a9d5c; border: 1px solid #c3e6cb; border-radius: 8px; padding: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn-rechazar { flex: 1; background: #fff0f0; color: #e63946; border: 1px solid #ffd0d0; border-radius: 8px; padding: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn-admin-toggle { flex: 1; background: #f0f4ff; color: #1a1a2e; border: 1px solid #c5cff5; border-radius: 8px; padding: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .permisos-grid { border-top: 1px solid #f0f0f0; padding-top: 12px; }
    .permisos-local { margin-bottom: 12px; }
    .permisos-local h5 { font-size: 12px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
    .permisos-modulos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .permiso-toggle { text-align: center; }
    .permiso-toggle span { font-size: 10px; color: #999; display: block; margin-bottom: 4px; }
    .toggle { position: relative; width: 36px; height: 20px; margin: 0 auto; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #ddd; border-radius: 20px; transition: 0.3s; }
    .toggle-slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s; }
    .toggle input:checked + .toggle-slider { background: #2a9d5c; }
    .toggle input:checked + .toggle-slider:before { transform: translateX(16px); }
    .sin-usuarios { text-align: center; padding: 40px 20px; color: #bbb; font-size: 14px; }
    .cargando { text-align: center; padding: 40px 20px; color: #999; font-size: 14px; }
    .btn-eliminar-usuario { background: none; border: none; color: #ddd; cursor: pointer; font-size: 16px; padding: 4px; }
    .btn-eliminar-usuario:hover { color: #e63946; }
  </style>
</head>
<body>

<header>
  <button class="btn-volver" onclick="window.location.href='index.html'">←</button>
  <h1>👤 Administrar usuarios</h1>
  <span class="badge-admin">ADMIN</span>
</header>

<div class="seccion-titulo">⏳ Pendientes de aprobación</div>
<div id="lista-pendientes"><div class="cargando">Cargando...</div></div>

<div class="seccion-titulo">✅ Usuarios aprobados</div>
<div id="lista-aprobados"><div class="cargando">Cargando...</div></div>

<div style="padding-bottom:40px;"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAB2-btgFqGiCe1YdZSDv4EShV601N-uQs",
    authDomain: "waysub-web.firebaseapp.com",
    projectId: "waysub-web",
    storageBucket: "waysub-web.firebasestorage.app",
    messagingSenderId: "219825581217",
    appId: "1:219825581217:web:6f752ee27a5446400114e0"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  const LOCALES = ['Ramos Mejía', 'Morón'];
  const MODULOS = [
    { key: 'axionlog', label: '📦 Axionlog' },
    { key: 'coca', label: '🥤 Coca' },
    { key: 'horas', label: '⏰ Horas' },
    { key: 'reportes', label: '📊 Reportes' }
  ];

  // Verificar que el usuario actual es admin
  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }
    const { getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const snap = await getDoc(doc(db, "usuarios", user.uid));
    if (!snap.exists() || snap.data().rol !== 'admin') {
      window.location.href = 'index.html'; return;
    }
    cargarUsuarios();
  });

  function cargarUsuarios() {
    onSnapshot(collection(db, "usuarios"), (snap) => {
      const pendientes = [], aprobados = [];
      snap.forEach(d => {
        const u = { id: d.id, ...d.data() };
        if (!u.aprobado) pendientes.push(u);
        else aprobados.push(u);
      });
      renderLista('lista-pendientes', pendientes, true);
      renderLista('lista-aprobados', aprobados, false);
    });
  }

  function renderLista(contenedorId, usuarios, esPendiente) {
    const cont = document.getElementById(contenedorId);
    if (usuarios.length === 0) {
      cont.innerHTML = '<div class="sin-usuarios">' + (esPendiente ? 'Sin solicitudes pendientes' : 'Sin usuarios aprobados') + '</div>';
      return;
    }
    cont.innerHTML = '';
    usuarios.forEach(u => cont.appendChild(crearCard(u, esPendiente)));
  }

  function crearCard(u, esPendiente) {
    const card = document.createElement('div');
    card.className = 'usuario-card';

    const permisos = u.permisos || {
      'Ramos Mejía': { axionlog: false, coca: false, horas: false, reportes: false },
      'Morón': { axionlog: false, coca: false, horas: false, reportes: false }
    };

    const badgeRol = u.rol === 'admin'
      ? '<span class="badge-admin">ADMIN</span>'
      : u.aprobado
        ? '<span class="badge-aprobado">Aprobado</span>'
        : '<span class="badge-pendiente">Pendiente</span>';

    let html = `
      <div class="usuario-header">
        <div class="usuario-info">
          <h4>${u.nombre || 'Sin nombre'}</h4>
          <p>${u.email}</p>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          ${badgeRol}
          <button class="btn-eliminar-usuario" onclick="window.eliminarUsuario('${u.id}')">🗑</button>
        </div>
      </div>
      <div class="btns-aprobacion">
        ${!u.aprobado ? `<button class="btn-aprobar" onclick="window.aprobar('${u.id}')">✅ Aprobar</button>` : ''}
        ${u.aprobado ? `<button class="btn-rechazar" onclick="window.revocar('${u.id}')">🚫 Revocar acceso</button>` : `<button class="btn-rechazar" onclick="window.eliminarUsuario('${u.id}')">❌ Rechazar</button>`}
        <button class="btn-admin-toggle" onclick="window.toggleAdmin('${u.id}', '${u.rol}')">
          ${u.rol === 'admin' ? '👤 Quitar admin' : '⭐ Hacer admin'}
        </button>
      </div>`;

    if (u.aprobado) {
      html += '<div class="permisos-grid">';
      LOCALES.forEach(local => {
        const permLocal = permisos[local] || { axionlog: false, coca: false, horas: false, reportes: false };
        html += `<div class="permisos-local"><h5>🏪 ${local}</h5><div class="permisos-modulos">`;
        MODULOS.forEach(mod => {
          const checked = permLocal[mod.key] ? 'checked' : '';
          html += `<div class="permiso-toggle">
            <span>${mod.label}</span>
            <label class="toggle">
              <input type="checkbox" ${checked} onchange="window.togglePermiso('${u.id}', '${local}', '${mod.key}', this.checked)">
              <span class="toggle-slider"></span>
            </label>
          </div>`;
        });
        html += '</div></div>';
      });
      html += '</div>';
    }

    card.innerHTML = html;
    return card;
  }

  window.aprobar = async function(uid) {
    await updateDoc(doc(db, "usuarios", uid), {
      aprobado: true,
      rol: 'usuario'
    });
  }

  window.revocar = async function(uid) {
    if (!confirm('¿Revocar acceso a este usuario?')) return;
    await updateDoc(doc(db, "usuarios", uid), { aprobado: false, rol: 'pendiente' });
  }

  window.toggleAdmin = async function(uid, rolActual) {
    const nuevoRol = rolActual === 'admin' ? 'usuario' : 'admin';
    await updateDoc(doc(db, "usuarios", uid), { rol: nuevoRol });
  }

  window.togglePermiso = async function(uid, local, modulo, valor) {
    const campo = 'permisos.' + local + '.' + modulo;
    await updateDoc(doc(db, "usuarios", uid), { [campo]: valor });
  }

  window.eliminarUsuario = async function(uid) {
    if (!confirm('¿Eliminar este usuario del sistema?')) return;
    await deleteDoc(doc(db, "usuarios", uid));
  }
</script>
</body>
</html>
