<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Viandas — Waysub Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }

  .header { background: #1a1a2e; color: white; padding: 16px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .btn-back { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .header h1 { font-size: 18px; font-weight: 600; flex: 1; }

  .tabs { display: flex; background: white; border-bottom: 2px solid #f0f2f5; position: sticky; top: 57px; z-index: 99; }
  .tab { flex: 1; padding: 13px 8px; text-align: center; font-size: 13px; font-weight: 600; color: #999; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .tab.activo { color: #1a1a2e; border-bottom-color: #1a1a2e; }

  .seccion { display: none; padding: 20px 16px 80px; max-width: 680px; margin: 0 auto; }
  .seccion.activa { display: block; }

  .section { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #f0f0f0; }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
  .field input { width: 100%; padding: 12px 14px; border: 1.5px solid #e8e8e8; border-radius: 10px; font-size: 15px; color: #1a1a2e; background: #fafafa; transition: border-color 0.2s; outline: none; font-family: inherit; }
  .field input:focus { border-color: #1a1a2e; background: white; }
  .field input[type="number"] { appearance: textfield; }
  .field input[type="number"]::-webkit-inner-spin-button,
  .field input[type="number"]::-webkit-outer-spin-button { display: none; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn-save { width: 100%; padding: 16px; background: #1a1a2e; color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; }
  .btn-save:disabled { background: #ccc; cursor: not-allowed; }

  /* PRODUCTOS DEL PEDIDO (carga) */
  .productos-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
  .producto-row { display: flex; gap: 8px; align-items: center; }
  .producto-row select { flex: 1; min-width: 0; padding: 12px 10px; border: 1.5px solid #e8e8e8; border-radius: 10px; font-size: 14px; color: #1a1a2e; background: #fafafa; outline: none; font-family: inherit; }
  .producto-row select:focus { border-color: #1a1a2e; background: white; }
  .producto-row .producto-cantidad { width: 60px; flex-shrink: 0; padding: 12px 6px; border: 1.5px solid #e8e8e8; border-radius: 10px; font-size: 14px; text-align: center; background: #fafafa; outline: none; font-family: inherit; }
  .producto-row .producto-cantidad:focus { border-color: #1a1a2e; background: white; }
  .btn-quitar-producto { background: #fff0f0; border: none; color: #e63946; border-radius: 8px; width: 40px; height: 40px; font-size: 16px; cursor: pointer; flex-shrink: 0; }
  .btn-agregar-producto { width: 100%; padding: 12px; background: #f0f2f5; border: 1.5px dashed #cccccc; border-radius: 10px; color: #555; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 6px; }

  /* LISTA */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-box { background: #1a1a2e; border-radius: 14px; padding: 14px 16px; }
  .stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(255,255,255,0.5); margin-bottom: 4px; }
  .stat-value { font-size: 20px; font-weight: 800; color: #2ecc71; }
  .stat-box.general .stat-value { color: #e8b84b; }

  .vianda-card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .vianda-info { flex: 1; min-width: 0; }
  .vianda-productos { font-size: 15px; font-weight: 700; color: #1a1a2e; margin-bottom: 6px; line-height: 1.4; }
  .vianda-productos .cant { color: #888; font-weight: 600; }
  .vianda-persona { font-size: 13px; color: #555; margin-bottom: 4px; }
  .vianda-meta { font-size: 12px; color: #aaa; display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .vianda-costos { font-size: 12px; color: #888; display: flex; gap: 10px; flex-wrap: wrap; }
  .vianda-costos b { color: #2a9d5c; }
  .vianda-total { font-size: 18px; font-weight: 800; color: #2a9d5c; white-space: nowrap; }
  .btn-del { background: #fff0f0; border: none; color: #e63946; border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: 14px; flex-shrink: 0; }

  .filtro-fecha { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .filtro-fecha input { flex: 1; min-width: 130px; padding: 10px 14px; border: 1.5px solid #e8e8e8; border-radius: 10px; font-size: 14px; background: white; outline: none; font-family: inherit; }
  .filtro-fecha input:focus { border-color: #1a1a2e; }

  .sin-datos { text-align: center; padding: 60px 20px; color: #bbb; }
  .sin-datos .icon { font-size: 40px; margin-bottom: 12px; }

  .loading-box { text-align: center; padding: 40px; color: #999; }
  .spinner { width: 36px; height: 36px; border: 3px solid #ddd; border-top-color: #1a1a2e; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1a1a2e; color: white; padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; transition: transform 0.3s; z-index: 999; white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: #2ecc71; color: #1a1a2e; }
  .toast.error { background: #e74c3c; }

  /* FILTRO DE PAGO (chips) */
  .filtro-pago { display: flex; gap: 8px; margin-bottom: 16px; }
  .chip { flex: 1; text-align: center; padding: 9px 8px; border-radius: 10px; background: white; color: #888; font-size: 13px; font-weight: 600; cursor: pointer; border: 1.5px solid #e8e8e8; }
  .chip.activo { background: #1a1a2e; color: white; border-color: #1a1a2e; }

  /* ESTADO DE PAGO (tarjeta) */
  .badge-pago { display: inline-block; font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 20px; margin-bottom: 6px; }
  .badge-pago.pendiente { background: #fff0d9; color: #b8790a; }
  .badge-pago.pagado { background: #e3f9ec; color: #1e8a4c; }
  .btn-pago { width: 100%; margin-top: 8px; padding: 9px; border: none; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .btn-pago.marcar-pagado { background: #2ecc71; color: #1a1a2e; }
  .btn-pago.marcar-pendiente { background: #f0f2f5; color: #888; }

  @media (max-width: 480px) {
    .two-col { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <button class="btn-back" onclick="window.location.href='index.html'">← Inicio</button>
  <h1>🥡 Stock Viandas</h1>
</div>

<div class="tabs">
  <div class="tab activo" onclick="cambiarTab('carga', this)">➕ Cargar</div>
  <div class="tab" onclick="cambiarTab('lista', this)">📋 Lista</div>
  <div class="tab" onclick="cambiarTab('facturacion', this)">💰 Facturación</div>
</div>

<!-- TAB CARGA -->
<div class="seccion activa" id="tab-carga">
  <div class="section">
    <div class="section-title">📦 Nuevo pedido</div>

    <div class="field">
      <label>Nombre de la persona</label>
      <input type="text" id="inp-persona" placeholder="Ej: Juan Pérez">
    </div>

    <div class="field">
      <label>Fecha de entrega</label>
      <input type="date" id="inp-fecha">
    </div>

    <div class="field">
      <label>Productos del pedido</label>
      <div class="productos-container" id="productos-container"></div>
      <button type="button" class="btn-agregar-producto" onclick="agregarProducto()">+ Agregar otro producto</button>
    </div>

    <div class="two-col">
      <div class="field">
        <label>Costo del pedido ($) <span style="font-weight:400;color:#aaa;">· automático</span></label>
        <input type="number" id="inp-costo-pedido" placeholder="0" inputmode="decimal">
      </div>
      <div class="field">
        <label>Costo del envío ($)</label>
        <input type="number" id="inp-costo-envio" placeholder="0" inputmode="decimal">
      </div>
    </div>

    <button class="btn-save" id="btn-guardar" onclick="guardarVianda()">Guardar pedido</button>
  </div>
</div>

<!-- TAB LISTA -->
<div class="seccion" id="tab-lista">
  <div class="filtro-fecha">
    <input type="date" id="filtro-desde" onchange="renderLista()">
    <input type="date" id="filtro-hasta" onchange="renderLista()">
  </div>
  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-label">Total pedidos</div>
      <div class="stat-value" id="total-pedido">$0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Total envíos</div>
      <div class="stat-value" id="total-envio">$0</div>
    </div>
    <div class="stat-box general">
      <div class="stat-label">Total general</div>
      <div class="stat-value" id="total-general">$0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Pendiente de cobro</div>
      <div class="stat-value" id="total-pendiente-cobro" style="color:#e8b84b;">$0</div>
    </div>
  </div>
  <div class="filtro-pago">
    <div class="chip activo" onclick="setFiltroPago('todos', this)">Todos</div>
    <div class="chip" onclick="setFiltroPago('pendientes', this)">Pendientes</div>
    <div class="chip" onclick="setFiltroPago('pagados', this)">Pagados</div>
  </div>
  <div id="lista-viandas">
    <div class="loading-box"><div class="spinner"></div><p>Cargando...</p></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- TAB FACTURACIÓN -->
<div class="seccion" id="tab-facturacion">
  <div class="section">
    <div class="section-title">📅 Mes</div>
    <input type="month" id="fact-mes" onchange="cargarFacturacionMes()" style="width:100%;padding:12px 14px;border:1.5px solid #e8e8e8;border-radius:10px;font-size:15px;color:#1a1a2e;background:#fafafa;outline:none;font-family:inherit;">
  </div>

  <div class="section">
    <div class="section-title">✏️ Datos del mes</div>
    <div class="field">
      <label>Ingreso por alquiler ($)</label>
      <input type="number" id="fact-alquiler" placeholder="0" inputmode="decimal" oninput="calcularTotalMensual()">
    </div>
    <div class="field">
      <label>Ingreso por 5% de facturación ($)</label>
      <input type="number" id="fact-cinco" placeholder="0" inputmode="decimal" oninput="calcularTotalMensual()">
    </div>
    <div class="field">
      <label>Costo neteado ($) <span style="font-weight:400;color:#e63946;">· resta</span></label>
      <input type="number" id="fact-costo" placeholder="0" inputmode="decimal" oninput="calcularTotalMensual()">
    </div>
    <button class="btn-save" id="btn-guardar-fact" onclick="guardarFacturacionMes()">Guardar mes</button>
  </div>

  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-label">Total de pedidos del mes</div>
      <div class="stat-value" id="fact-total-pedidos">$0</div>
    </div>
    <div class="stat-box general">
      <div class="stat-label">Total mensual</div>
      <div class="stat-value" id="fact-total-mensual">$0</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">📋 Meses guardados</div>
    <div id="lista-facturacion"><div class="loading-box"><div class="spinner"></div><p>Cargando...</p></div></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAB2-btgFqGiCe1YdZSDv4EShV601N-uQs",
  authDomain: "waysub-web.firebaseapp.com",
  projectId: "waysub-web",
  storageBucket: "waysub-web.firebasestorage.app",
  messagingSenderId: "219825581217",
  appId: "1:219825581217:web:6f752ee27a5446400114e0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🍽️ Catálogo de productos de viandas con precio. Para agregar/quitar productos
// o actualizar precios, simplemente editá esta lista (respetando comillas y comas).
// El costo del pedido se calcula solo a partir de estos precios x cantidad.
const PRODUCTOS_VIANDAS = [
  { producto: "Carré de Cerdo con Puré de Batata", precio: 11500 },
  { producto: "Milanesa de Soja Napolitana con Puré de Papas", precio: 10500 },
  { producto: "Ravioles de Espinaca con Salsa Rosa", precio: 10500 },
  { producto: "Ensalada Caesar", precio: 10500 },
  { producto: "Guiso de Lentejas Vegano", precio: 9500 },
  { producto: "Cazuela de Arroz con Pollo", precio: 9500 },
  { producto: "Pechuga de Pollo con Arroz Cremoso y Huevo", precio: 11000 },
  { producto: "Risotto de Hongos", precio: 10500 },
  { producto: "Goulash de Ternera con Conchiglie a la Crema", precio: 10500 },
  { producto: "Milanesa de Ternera con Puré de Papas", precio: 11500 },
  { producto: "Ternera Estofada con Fideos", precio: 11000 },
  { producto: "Milanesa de Pollo con Conchiglie a la Crema", precio: 10500 },
  { producto: "Sorrentinos de Jamón y Queso con Salsa de Hongos", precio: 11500 },
  { producto: "Milanesa de Ternera con Fideos", precio: 11500 }
];

let viandas = [];
let nombreUsuario = '';
let filtroPago = 'todos'; // 'todos' | 'pendientes' | 'pagados'

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  const snap = await getDoc(doc(db, 'usuarios', user.uid));
  if (!snap.exists() || !snap.data().aprobado) { window.location.href = 'login.html'; return; }

  const userData = snap.data();
  const accesos = userData.accesos || {};
  const esAdmin = userData.rol === 'admin';
  if (!esAdmin && !accesos.ver_viandas) { window.location.href = 'index.html'; return; }

  nombreUsuario = userData.nombre || user.email;

  // Fecha de hoy por defecto
  const hoy = new Date().toISOString().split('T')[0];
  document.getElementById('inp-fecha').value = hoy;

  // Filtros default: este mes
  const primeroDeMes = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0];
  document.getElementById('filtro-desde').value = primeroDeMes;
  document.getElementById('filtro-hasta').value = hoy;

  // Arranca el formulario con una fila de producto vacía
  resetProductosContainer();

  await cargarViandas();

  // Facturación: arranca en el mes actual
  document.getElementById('fact-mes').value = hoy.slice(0, 7);
  await cargarFacturacionMes();
  await cargarListaFacturacion();
});

async function cargarViandas() {
  try {
    const snap = await getDocs(collection(db, 'stock_viandas'));
    viandas = [];
    snap.forEach(d => viandas.push({ id: d.id, ...d.data() }));
    viandas.sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
    renderLista();
  } catch(e) {
    console.error(e);
  }
}

window.cambiarTab = function(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('activo'));
  document.querySelectorAll('.seccion').forEach(s => s.classList.remove('activa'));
  el.classList.add('activo');
  document.getElementById('tab-' + tab).classList.add('activa');
};

// ---------- FILAS DE PRODUCTOS (carga) ----------

function crearFilaProducto() {
  const row = document.createElement('div');
  row.className = 'producto-row';

  const opciones = PRODUCTOS_VIANDAS.map(p => `<option value="${p.producto}" data-precio="${p.precio}">${p.producto}</option>`).join('');
  row.innerHTML = `
    <select class="producto-select">
      <option value="">Seleccionar producto...</option>
      ${opciones}
    </select>
    <input type="number" class="producto-cantidad" value="1" min="1" inputmode="numeric">
    <button type="button" class="btn-quitar-producto" onclick="quitarProducto(this)">✕</button>
  `;

  row.querySelector('.producto-select').addEventListener('change', actualizarCostoPedido);
  row.querySelector('.producto-cantidad').addEventListener('input', actualizarCostoPedido);

  return row;
}

function actualizarCostoPedido() {
  const filas = document.querySelectorAll('#productos-container .producto-row');
  let total = 0;
  filas.forEach(f => {
    const opt = f.querySelector('.producto-select').selectedOptions[0];
    const precio = opt ? parseFloat(opt.dataset.precio) || 0 : 0;
    const cantidad = parseInt(f.querySelector('.producto-cantidad').value) || 0;
    total += precio * cantidad;
  });
  document.getElementById('inp-costo-pedido').value = total || '';
}

function resetProductosContainer() {
  const cont = document.getElementById('productos-container');
  cont.innerHTML = '';
  cont.appendChild(crearFilaProducto());
  actualizarCostoPedido();
}

window.agregarProducto = function() {
  document.getElementById('productos-container').appendChild(crearFilaProducto());
};

window.quitarProducto = function(btn) {
  const cont = document.getElementById('productos-container');
  const row = btn.closest('.producto-row');
  row.remove();
  if (!cont.children.length) cont.appendChild(crearFilaProducto());
  actualizarCostoPedido();
};

function leerProductosDelForm() {
  const filas = document.querySelectorAll('#productos-container .producto-row');
  const productos = [];
  filas.forEach(f => {
    const producto = f.querySelector('.producto-select').value;
    const cantidad = parseInt(f.querySelector('.producto-cantidad').value) || 0;
    if (producto && cantidad > 0) productos.push({ producto, cantidad });
  });
  return productos;
}

// ---------- GUARDAR ----------

window.guardarVianda = async function() {
  const persona = document.getElementById('inp-persona').value.trim();
  const fecha = document.getElementById('inp-fecha').value;
  const costoPedido = parseFloat(document.getElementById('inp-costo-pedido').value) || 0;
  const costoEnvio = parseFloat(document.getElementById('inp-costo-envio').value) || 0;
  const productos = leerProductosDelForm();

  if (!persona || !fecha) {
    toast('Completá persona y fecha', 'error');
    return;
  }
  if (!productos.length) {
    toast('Agregá al menos un producto', 'error');
    return;
  }

  const btn = document.getElementById('btn-guardar');
  btn.disabled = true; btn.textContent = 'Guardando...';

  try {
    const nueva = { productos, persona, fecha, costoPedido, costoEnvio, pagado: false, cargadoPor: nombreUsuario, timestamp: serverTimestamp() };
    const ref = await addDoc(collection(db, 'stock_viandas'), nueva);
    viandas.unshift({ id: ref.id, ...nueva, timestamp: Date.now() });
    viandas.sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));

    // Limpiar form
    document.getElementById('inp-persona').value = '';
    document.getElementById('inp-costo-pedido').value = '';
    document.getElementById('inp-costo-envio').value = '';
    document.getElementById('inp-fecha').value = new Date().toISOString().split('T')[0];
    resetProductosContainer();

    toast('✅ Pedido guardado', 'success');
    renderLista();
  } catch(e) {
    console.error(e);
    toast('❌ Error al guardar', 'error');
  }

  btn.disabled = false; btn.textContent = 'Guardar pedido';
};

// ---------- LECTURA COMPATIBLE (pedidos viejos con un solo producto) ----------

function getProductosDeVianda(v) {
  if (Array.isArray(v.productos) && v.productos.length) return v.productos;
  if (v.producto) return [{ producto: v.producto, cantidad: 1 }];
  return [];
}

function getCostoEnvio(v) {
  if (typeof v.costoEnvio === 'number') return v.costoEnvio;
  return v.costo || 0; // formato viejo: "costo" era el envío
}

function getCostoPedido(v) {
  return v.costoPedido || 0;
}

function getPagado(v) {
  return v.pagado === true; // pedidos viejos sin este campo cuentan como pendientes
}

// ---------- LISTA ----------

window.setFiltroPago = function(valor, el) {
  filtroPago = valor;
  document.querySelectorAll('.filtro-pago .chip').forEach(c => c.classList.remove('activo'));
  el.classList.add('activo');
  renderLista();
};

window.renderLista = function() {
  const desde = document.getElementById('filtro-desde').value;
  const hasta = document.getElementById('filtro-hasta').value;
  const lista = document.getElementById('lista-viandas');

  // Filtro por rango de fechas: se usa para las estadísticas del período completo
  const filtradas = viandas.filter(v => (!desde || v.fecha >= desde) && (!hasta || v.fecha <= hasta));

  const totalEnvio = filtradas.reduce((acc, v) => acc + getCostoEnvio(v), 0);
  const totalPedido = filtradas.reduce((acc, v) => acc + getCostoPedido(v), 0);
  const totalGeneral = totalEnvio + totalPedido;
  const totalPendienteCobro = filtradas.reduce((acc, v) => acc + (!getPagado(v) ? getCostoEnvio(v) + getCostoPedido(v) : 0), 0);

  document.getElementById('total-envio').textContent = '$' + totalEnvio.toLocaleString('es-AR');
  document.getElementById('total-pedido').textContent = '$' + totalPedido.toLocaleString('es-AR');
  document.getElementById('total-general').textContent = '$' + totalGeneral.toLocaleString('es-AR');
  document.getElementById('total-pendiente-cobro').textContent = '$' + totalPendienteCobro.toLocaleString('es-AR');

  // Filtro por estado de pago (chips): se usa solo para qué tarjetas se muestran
  const vista = filtradas.filter(v => {
    if (filtroPago === 'pendientes') return !getPagado(v);
    if (filtroPago === 'pagados') return getPagado(v);
    return true;
  });

  if (!vista.length) {
    lista.innerHTML = '<div class="sin-datos"><div class="icon">📭</div><p>Sin pedidos en este período</p></div>';
    return;
  }

  lista.innerHTML = vista.map(v => {
    const productos = getProductosDeVianda(v);
    const costoEnvio = getCostoEnvio(v);
    const costoPedido = getCostoPedido(v);
    const total = costoEnvio + costoPedido;

    const listaProductos = productos.map(p =>
      `<span class="cant">${p.cantidad}x</span> ${p.producto}`
    ).join('<br>');

    const pagado = getPagado(v);
    const badge = pagado
      ? `<span class="badge-pago pagado">✅ Pagado</span>`
      : `<span class="badge-pago pendiente">💰 No pagado</span>`;
    const btnPago = pagado
      ? `<button class="btn-pago marcar-pendiente" onclick="window.togglePago('${v.id}', ${pagado})">Marcar como no pagado</button>`
      : `<button class="btn-pago marcar-pagado" onclick="window.togglePago('${v.id}', ${pagado})">Marcar como pagado</button>`;

    return `
    <div class="vianda-card">
      <div class="vianda-info">
        ${badge}
        <div class="vianda-productos">${listaProductos}</div>
        <div class="vianda-persona">👤 ${v.persona}</div>
        <div class="vianda-meta">
          <span>📅 ${formatFecha(v.fecha)}</span>
          ${v.cargadoPor ? `<span>Cargado por: ${v.cargadoPor}</span>` : ''}
        </div>
        <div class="vianda-costos">
          <span>Pedido: <b>$${costoPedido.toLocaleString('es-AR')}</b></span>
          <span>Envío: <b>$${costoEnvio.toLocaleString('es-AR')}</b></span>
        </div>
        ${btnPago}
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
        <span class="vianda-total">$${total.toLocaleString('es-AR')}</span>
        <button class="btn-del" onclick="window.eliminarVianda('${v.id}')">🗑</button>
      </div>
    </div>
  `;
  }).join('');
};

window.togglePago = async function(id, estabaPagado) {
  try {
    await updateDoc(doc(db, 'stock_viandas', id), { pagado: !estabaPagado });
    const v = viandas.find(x => x.id === id);
    if (v) v.pagado = !estabaPagado;
    renderLista();
    toast(!estabaPagado ? '✅ Marcado como pagado' : 'Marcado como no pagado', 'success');
  } catch(e) {
    console.error(e);
    toast('❌ Error al actualizar', 'error');
  }
};

window.eliminarVianda = async function(id) {
  if (!confirm('¿Eliminar este pedido?')) return;
  try {
    await deleteDoc(doc(db, 'stock_viandas', id));
    viandas = viandas.filter(v => v.id !== id);
    renderLista();
    toast('Eliminado', '');
  } catch(e) {
    toast('❌ Error al eliminar', 'error');
  }
};

function formatFecha(str) {
  if (!str) return '—';
  const [y, m, d] = str.split('-');
  const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${d} ${meses[parseInt(m)-1]} ${y}`;
}

function toast(msg, tipo = '') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + tipo;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ---------- FACTURACIÓN MENSUAL ----------

function getTotalPedidosDelMes(mes) {
  // Solo el costo de los productos (sin envío) de todas las viandas cargadas ese mes (formato mes: "YYYY-MM")
  return viandas.reduce((acc, v) => {
    if (!v.fecha || !v.fecha.startsWith(mes)) return acc;
    return acc + getCostoPedido(v);
  }, 0);
}

window.calcularTotalMensual = function() {
  const mes = document.getElementById('fact-mes').value;
  if (!mes) return;
  const alquiler = parseFloat(document.getElementById('fact-alquiler').value) || 0;
  const cinco = parseFloat(document.getElementById('fact-cinco').value) || 0;
  const costo = parseFloat(document.getElementById('fact-costo').value) || 0;
  const totalPedidos = getTotalPedidosDelMes(mes);
  const totalMensual = alquiler + cinco + totalPedidos - costo;

  document.getElementById('fact-total-pedidos').textContent = '$' + totalPedidos.toLocaleString('es-AR');
  document.getElementById('fact-total-mensual').textContent = '$' + totalMensual.toLocaleString('es-AR');
  return { alquiler, cinco, costo, totalPedidos, totalMensual };
};

window.cargarFacturacionMes = async function() {
  const mes = document.getElementById('fact-mes').value;
  if (!mes) return;
  try {
    const snap = await getDoc(doc(db, 'viandas_facturacion', mes));
    if (snap.exists()) {
      const d = snap.data();
      document.getElementById('fact-alquiler').value = d.ingresoAlquiler || '';
      document.getElementById('fact-cinco').value = d.ingreso5Facturacion || '';
      document.getElementById('fact-costo').value = d.costoNeteado || '';
    } else {
      document.getElementById('fact-alquiler').value = '';
      document.getElementById('fact-cinco').value = '';
      document.getElementById('fact-costo').value = '';
    }
  } catch(e) {
    console.error(e);
  }
  calcularTotalMensual();
};

window.guardarFacturacionMes = async function() {
  const mes = document.getElementById('fact-mes').value;
  if (!mes) { toast('Elegí un mes primero', 'error'); return; }

  const btn = document.getElementById('btn-guardar-fact');
  btn.disabled = true; btn.textContent = 'Guardando...';

  const { alquiler, cinco, costo, totalPedidos, totalMensual } = calcularTotalMensual();

  try {
    await setDoc(doc(db, 'viandas_facturacion', mes), {
      mes,
      ingresoAlquiler: alquiler,
      ingreso5Facturacion: cinco,
      costoNeteado: costo,
      totalPedidos,
      totalMensual,
      cargadoPor: nombreUsuario,
      timestamp: Date.now()
    });
    toast('✅ Mes guardado', 'success');
    await cargarListaFacturacion();
  } catch(e) {
    console.error(e);
    toast('❌ Error al guardar', 'error');
  }

  btn.disabled = false; btn.textContent = 'Guardar mes';
};

window.cargarListaFacturacion = async function() {
  const cont = document.getElementById('lista-facturacion');
  try {
    const snap = await getDocs(collection(db, 'viandas_facturacion'));
    const meses = [];
    snap.forEach(d => meses.push(d.data()));
    meses.sort((a, b) => (b.mes || '').localeCompare(a.mes || ''));

    if (!meses.length) {
      cont.innerHTML = '<div class="sin-datos"><div class="icon">📭</div><p>Sin meses guardados</p></div>';
      return;
    }

    cont.innerHTML = meses.map(m => {
      // Recalculamos el total de pedidos y el total mensual con los datos actuales,
      // en vez de confiar en el número que quedó guardado ese día — así, si algún
      // pedido de viandas cambia después, o se corrige la fórmula, este número
      // siempre está al día sin que haya que volver a guardar el mes a mano.
      const totalPedidos = getTotalPedidosDelMes(m.mes);
      const totalMensual = (m.ingresoAlquiler||0) + (m.ingreso5Facturacion||0) + totalPedidos - (m.costoNeteado||0);
      return `
      <div class="vianda-card">
        <div class="vianda-info">
          <div class="vianda-productos">${formatMes(m.mes)}</div>
          <div class="vianda-costos">
            <span>Alquiler: <b>$${(m.ingresoAlquiler||0).toLocaleString('es-AR')}</b></span>
            <span>5%: <b>$${(m.ingreso5Facturacion||0).toLocaleString('es-AR')}</b></span>
            <span>Pedidos: <b>$${totalPedidos.toLocaleString('es-AR')}</b></span>
            <span>Costo: <b>-$${(m.costoNeteado||0).toLocaleString('es-AR')}</b></span>
          </div>
        </div>
        <span class="vianda-total">$${totalMensual.toLocaleString('es-AR')}</span>
      </div>
    `;
    }).join('');
  } catch(e) {
    console.error(e);
    cont.innerHTML = '<div class="sin-datos"><div class="icon">⚠️</div><p>Error al cargar</p></div>';
  }
};

function formatMes(mesStr) {
  if (!mesStr) return '—';
  const [y, m] = mesStr.split('-');
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return `${meses[parseInt(m)-1]} ${y}`;
}
